<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | CampusCollab</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <!-- Logo and Title Container -->
        <div style="display: flex; align-items: center; gap: 12px;">
            <img src="logo.png" alt="CampusCollab Logo" style="height: 35px; width: auto;">
            <h1 style="margin: 0;">
                <a href="index.html" style="text-decoration: none; color: var(--primary);">CampusCollab</a>
            </h1>
        </div>
        <button class="menu-toggle" onclick="toggleMobileMenu()">☰</button>
        <nav>
            <a href="projects.html">Back to Feed</a>
            <button id="logoutBtn">Logout</button>
        </nav>
        <script>
            function toggleMobileMenu() {
                document.querySelector('header nav').classList.toggle('active');
            }
        </script>
    </header>

    <!-- Replace your <main> section in public/profile.html with this -->
    <main>
        <!-- NEW: The Visual Profile Display -->
        <div class="profile-card" id="profileDisplayCard">
            <!-- JS will populate this -->
            <p>Loading profile...</p>
        </div>
    
        <!-- The Update Form wrapped in a form-container -->
        <div class="form-container" style="margin: 0; max-width: 100%;">
            <h2 style="text-align: left;">Update Profile</h2>
            <form id="profileForm">
                <input type="email" id="email" disabled>
                <input type="text" id="name" placeholder="Full Name" required>
                <input type="text" id="city" placeholder="City">
                <input type="text" id="contact" placeholder="Contact Number">
                <textarea id="bio" placeholder="Bio"></textarea>
    
                <label>Update Profile Picture:</label>
                <input type="file" id="profile_pic" accept="image/*">
    
                <label>Update Resume (PDF):</label>
                <input type="file" id="resume" accept="application/pdf">
    
                <button type="submit">Save Changes</button>
                <p id="statusMessage"></p>
            </form>
        </div>
    
        <!-- public/profile.html (Replace the bottom three lists with this) -->
        
        <!-- The rest of your lists -->
        <div class="dashboard-card">
            <h2>Applications Received</h2>
            <div id="receivedApplicationsContainer"></div>
        </div>
        
        <div class="dashboard-card">
            <h2>My Applications</h2>
            <div id="myApplicationsContainer"></div>
        </div>
        
        <div class="dashboard-card">
            <h2>Projects I Created</h2>
            <div id="myProjectsContainer"></div>
        </div>
        </main>
    </main>

    <script src="profile.js"></script>
</body>

</html>
