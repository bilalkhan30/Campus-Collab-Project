<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CampusCollab</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <!-- Logo and Title Container -->
        <div style="display: flex; align-items: center; gap: 12px;">
            <img src="logo.png" alt="CampusCollab Logo" style="height: 35px; width: auto;">
            <h1 style="margin: 0;">
                <a href="index.html" style="text-decoration: none; color: var(--primary);">CampusCollab</a>
            </h1>
        </div>
        <button class="menu-toggle" onclick="toggleMobileMenu()">☰</button>
        <nav><a href="register.html">Register</a></nav>
        <script>
            function toggleMobileMenu() {
                document.querySelector('header nav').classList.toggle('active');
            }
        </script>
    </header>

    <main>
        <h2 style="text-align: center;">Welcome Back</h2>
        <div class="form-container">
            <form id="loginForm">
                <input type="email" id="email" placeholder="College Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>
        <p id="errorMessage" style="color: red; text-align: center;"></p>
    </main>

    <script src="auth.js"></script>
</body>

</html>
