<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CampusCollab</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <!-- Logo and Title Container -->
        <div style="display: flex; align-items: center; gap: 12px;">
            <img src="logo.png" alt="CampusCollab Logo" style="height: 35px; width: auto;">
            <h1 style="margin: 0;">
                <a href="index.html" style="text-decoration: none; color: var(--primary);">CampusCollab</a>
            </h1>
        </div>
        <button class="menu-toggle" onclick="toggleMobileMenu()">☰</button>
        <nav><a href="login.html">Login</a></nav>
        <script>
            function toggleMobileMenu() {
                document.querySelector('header nav').classList.toggle('active');
            }
        </script>
    </header>

    <main>
        <div class="form-container">
            <h2>Create Your Account</h2>
            <form id="registerForm">
                <input type="text" id="name" placeholder="Full Name" required>
                <input type="email" id="email" placeholder="College Email" required autocomplete="username">
                <input type="password" id="password" placeholder="Password" required autocomplete="new-password">

                <input type="text" id="city" placeholder="City">
                <input type="text" id="contact" placeholder="Contact Number">
                <textarea id="bio" placeholder="Tell us about your skills..."></textarea>

                <label>Profile Picture (Optional):</label>
                <input type="file" id="profile_pic" accept="image/*">

                <label>Resume PDF (Optional):</label>
                <input type="file" id="resume" accept="application/pdf">

                <button type="submit">Register</button>
            </form>
            <p id="errorMessage" style="color: red; text-align: center; margin-top: 1rem;"></p>
        </div>
    </main>
    <script src="auth.js"></script>
</body>

</html>
