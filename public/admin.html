<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | CampusCollab</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Admin specific table styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: white;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #1e293b;
            color: white;
        }

        .danger-btn {
            background: #dc2626;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }

        .section-container {
            margin-bottom: 4rem;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <header style="background: #0f172a;"> <!-- Darker header for admin mode -->
        <h1>Admin Control Panel</h1>
        <nav>
            <a href="projects.html" style="color: white; margin-right: 15px;">Exit to Feed</a>
            <button id="logoutBtn">Logout</button>
        </nav>
    </header>

    <main style="max-width: 1400px;">
        <div class="section-container">
            <h2>Registered Users & Statistics</h2>
            <p id="usersStatus" style="color: orange;">Loading users...</p>
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Projects Created</th>
                        <th>Projects Applied To</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- JS will populate rows here -->
                </tbody>
            </table>
        </div>

        <div class="section-container">
            <h2>User Feedback & Reports</h2>
            <table id="feedbackTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody id="feedbackTableBody">
                    <!-- JS will populate rows here -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="admin.js"></script>
</body>

</html>
