<body>
    <header> <!-- Darker header for admin mode -->
        <div style="display: flex; align-items: center; gap: 12px;">
            <img src="logo.png" alt="CampusCollab Logo" style="height: 35px; width: auto;">
            <h1 style="margin: 0;">
                <a href="index.html" style="text-decoration: none; color: var(--primary);">CampusCollab</a>
            </h1>
        </div>
        <button class="menu-toggle" onclick="toggleMobileMenu()">☰</button>
        <nav>
            <a href="projects.html">Exit to Feed</a>
            <button id="logoutBtn">Logout</button>
        </nav>
        <script>
            function toggleMobileMenu() {
                document.querySelector('header nav').classList.toggle('active');
            }
        </script>
    </header>

    <main style="max-width: 1400px;">
        <div class="section-container">
            <h2>Registered Users & Statistics</h2>
            <p id="usersStatus" style="color: orange;">Loading users...</p>
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Projects Created</th>
                        <th>Projects Applied To</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- JS will populate rows here -->
                </tbody>
            </table>
        </div>

        <div class="section-container">
            <h2>User Feedback & Reports</h2>
            <table id="feedbackTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody id="feedbackTableBody">
                    <!-- JS will populate rows here -->
                </tbody>
            </table>
        </div>
        <!-- PROFILE MODAL POPUP -->
        <div id="profileModal" class="modal-overlay">
            <div class="modal-content">
                <span class="close-modal" onclick="closeProfileModal()">&times;</span>
                <div id="modalProfileContent">
                    <!-- JS will inject the profile card here -->
                </div>
            </div>
        </div>
    </main>

    <script src="admin.js"></script>
</body>

</html>
